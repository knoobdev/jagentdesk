name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: packages/server/go/tsnet-bridge/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies for typecheck
        run: |
          npm run build:server
          npm run build:app-deps

      - name: Verify tag and package versions
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Expected a semver tag such as v1.0.0, got ${tag}`);
          }
          const expectedVersion = tag.slice(1);
          const packageFiles = ["package.json"];
          for (const workspace of JSON.parse(fs.readFileSync("package.json", "utf8")).workspaces) {
            packageFiles.push(`${workspace}/package.json`);
          }
          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== expectedVersion) {
              throw new Error(`${file} is ${pkg.version}; expected ${expectedVersion}`);
            }
          }
          console.log(`Validated ${tag} against ${packageFiles.length} package manifests.`);
          NODE

      - name: Typecheck
        run: npm run typecheck

  create-release:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JAgentDesk $RELEASE_TAG" \
              --generate-notes
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [validate, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            build_args: "--linux --x64"
          - name: windows-x64
            runner: windows-latest
            build_args: "--win --x64"
          - name: macos-arm64
            runner: macos-14
            build_args: "--mac --arm64"
          - name: macos-x64
            runner: macos-15-intel
            build_args: "--mac --x64"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: packages/server/go/tsnet-bridge/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        shell: bash
        working-directory: packages/desktop
        env:
          EP_GH_IGNORE_TIME: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npm --prefix ../.. run build:app-deps:clean
          (cd ../app && JAGENTDESK_WEB_PLATFORM=electron npx expo export --platform web)
          desktop_dir="$PWD"
          extra_args=()
          if [[ "${{ matrix.name }}" == macos-* ]]; then
            extra_args+=(
              "-c.mac.notarize=false"
              "-c.mac.hardenedRuntime=false"
              "-c.mac.entitlements=${desktop_dir}/build/entitlements.mac.plist"
              "-c.mac.entitlementsInherit=${desktop_dir}/build/entitlements.mac.inherit.plist"
            )
          fi
          npm run build -- --publish never ${{ matrix.build_args }} "${extra_args[@]}"

      - name: Upload desktop files to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages/desktop/release -maxdepth 1 -type f ! -name '*.yml' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release files were produced."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload desktop workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: packages/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  mobile-android:
    name: Mobile Android APK
    needs: [validate, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android app dependencies
        run: |
          npm run build:app-deps
          npm --prefix packages/app run build:terminal-webview

      - name: Build Android APK locally
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          export APP_VARIANT=production
          cd packages/app
          npx expo prebuild --platform android --clean --non-interactive
          cd android
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs=-Xmx2048m \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x generateReleaseLintModel \
            -x generateReleaseLintVitalModel
          asset_path="$RUNNER_TEMP/JAgentDesk-${RELEASE_TAG}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Android APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk
          path: ${{ steps.artifact.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 14

  mobile-ios-simulator:
    name: Mobile iOS Simulator
    needs: [validate, create-release]
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build iOS app dependencies
        run: |
          npm run build:app-deps
          npm --prefix packages/app run build:terminal-webview

      - name: Build iOS Simulator artifact locally
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          export APP_VARIANT=production
          cd packages/app
          npx expo prebuild --platform ios --clean --non-interactive
          cd ios
          pod install --repo-update
          derived_data="$RUNNER_TEMP/jagentdesk-ios-derived"
          xcodebuild \
            -workspace JAgentDesk.xcworkspace \
            -scheme JAgentDesk \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          asset_path="$RUNNER_TEMP/JAgentDesk-${RELEASE_TAG}-ios-simulator.tar.gz"
          tar -czf "$asset_path" -C "$derived_data/Build/Products/Release-iphonesimulator" JAgentDesk.app
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload iOS Simulator artifact to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload iOS Simulator workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-simulator
          path: ${{ steps.artifact.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 14
