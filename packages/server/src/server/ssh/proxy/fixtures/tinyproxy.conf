# tinyproxy without authentication — allows CONNECT to any port (no ConnectPort stanza).
Port 8888
Listen 0.0.0.0
User tinyproxy
Group tinyproxy
Timeout 300
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/dev/stdout"
LogLevel Info
PidFile "/tmp/tinyproxy.pid"
MaxClients 100
Allow 0.0.0.0/0
