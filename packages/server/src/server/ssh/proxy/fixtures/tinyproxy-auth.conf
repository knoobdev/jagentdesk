# tinyproxy with Proxy-Authorization Basic. tinyproxy's BasicAuth regex keeps the
# quotes it matches, so the arguments must stay unquoted; "/" applies to every
# request, CONNECT included. No ConnectPort stanza → all destination ports allowed.
Port 8888
Listen 0.0.0.0
User tinyproxy
Group tinyproxy
Timeout 300
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/dev/stdout"
LogLevel Info
PidFile "/tmp/tinyproxy.pid"
MaxClients 100
Allow 0.0.0.0/0
BasicAuth proxyuser proxypass
