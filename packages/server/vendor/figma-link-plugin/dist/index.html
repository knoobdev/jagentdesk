<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAgentDesk Figma Link</title>
    <style>:root {
  --bg-primary: #0f172b;
  --text-label: #cad5e2;
  --text-value: #f1f5f9;
  --dot-connected: #17b26a;
  --dot-warn: #f59e0b;
  --dot-disconnected: #f04438;
  --text-white: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-value);
  font-size: 12px;
}

#root {
  padding: 10px 12px;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.title {
  font-weight: 600;
  color: var(--text-label);
  flex: 1;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.dot--on {
  background: var(--dot-connected);
}

.dot--warn {
  background: var(--dot-warn);
}

.dot--off {
  background: var(--dot-disconnected);
}

.status {
  margin-top: 8px;
  color: var(--text-label);
}

.status--ok {
  color: var(--dot-connected);
}

.status--warn {
  color: var(--dot-warn);
}

.status--error {
  color: var(--dot-disconnected);
}

.code {
  margin-top: 6px;
  font-size: 26px;
  letter-spacing: 6px;
  font-variant-numeric: tabular-nums;
  color: var(--text-white);
}

.re-pair {
  border: 1px solid #ffffff22;
  background: transparent;
  color: var(--text-label);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
}

.re-pair:hover {
  background: #ffffff14;
}
</style>
  </head>
  <body>
    <div id="root">
      <header class="row">
        <span id="dot" class="dot dot--off"></span>
        <span class="title">JAgentDesk Figma Link</span>
        <button id="re-pair" class="re-pair" type="button">Pair again</button>
      </header>
      <p id="status" class="status"></p>
      <p id="code" class="code"></p>
    </div>
    <script>"use strict";
(() => {
  // src/plugin-version.ts
  var PLUGIN_VERSION = "1.0.0";
  var BRIDGE_PROTOCOL_VERSION = 1;

  // src/ui/main.ts
  var DAEMON_URL = "ws://127.0.0.1:1995/ws";
  var RECONNECT_MIN_MS = 500;
  var RECONNECT_MAX_MS = 5e3;
  var root = document.getElementById("root");
  var config = null;
  var state = { kind: "waiting" };
  var socket = null;
  var reconnectTimer = null;
  var reconnectDelay = RECONNECT_MIN_MS;
  var stopped = false;
  var inFlight = /* @__PURE__ */ new Map();
  var setStatus = (text, tone) => {
    const status = document.getElementById("status");
    status.textContent = text;
    status.className = `status${tone ? ` status--${tone}` : ""}`;
  };
  var render = () => {
    const connected = document.getElementById("dot");
    const codeBox = document.getElementById("code");
    switch (state.kind) {
      case "waiting":
        connected.className = "dot dot--off";
        setStatus("Open JAgentDesk to connect.", "");
        codeBox.textContent = "";
        break;
      case "connecting":
        connected.className = "dot dot--off";
        setStatus("Connecting to JAgentDesk\u2026", "");
        break;
      case "unpaired":
        connected.className = "dot dot--warn";
        setStatus("Enter this code in JAgentDesk to pair:", "warn");
        codeBox.textContent = state.code;
        break;
      case "paired":
        connected.className = "dot dot--on";
        setStatus(config ? `Connected \xB7 ${config.fileName}` : "Connected", "ok");
        codeBox.textContent = "";
        break;
      case "blocked":
        connected.className = "dot dot--warn";
        setStatus(`Update JAgentDesk \u2014 ${state.reason} (needs v${state.requiredVersion})`, "warn");
        codeBox.textContent = "";
        break;
      case "rejected":
        connected.className = "dot dot--off";
        setStatus(`Rejected by JAgentDesk: ${state.reason}`, "error");
        codeBox.textContent = "";
        break;
      case "offline":
        connected.className = "dot dot--off";
        setStatus("JAgentDesk is not running on this machine.", "");
        break;
    }
  };
  var send = (frame) => {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(frame));
  };
  var hello = () => {
    if (!config) return;
    send({
      type: "hello",
      name: "JAgentDesk Figma Link",
      version: PLUGIN_VERSION,
      protocol: BRIDGE_PROTOCOL_VERSION,
      fileKey: config.fileKey,
      fileName: config.fileName,
      manager: config.manager,
      instanceId: config.instanceId,
      ...config.pairingId ? { pairingId: config.pairingId } : {},
      ...config.pairingKey ? { pairingKey: config.pairingKey } : {}
    });
  };
  var connect = () => {
    if (!config || stopped) return;
    state = { kind: "connecting" };
    render();
    const url = `${DAEMON_URL}?version=${encodeURIComponent(PLUGIN_VERSION)}&protocol=${BRIDGE_PROTOCOL_VERSION}&fileKey=${encodeURIComponent(config.fileKey)}&fileName=${encodeURIComponent(config.fileName)}`;
    const ws = new WebSocket(url);
    socket = ws;
    ws.onopen = () => {
      reconnectDelay = RECONNECT_MIN_MS;
      hello();
    };
    ws.onmessage = (event) => {
      let frame;
      try {
        frame = JSON.parse(String(event.data));
      } catch {
        return;
      }
      switch (frame.type) {
        case "hello_ack":
          state = { kind: "paired" };
          render();
          return;
        case "pairing_required":
          state = {
            kind: "unpaired",
            code: String(frame.code ?? ""),
            expiresAt_ms: Number(frame.expiresAt_ms ?? 0)
          };
          render();
          return;
        case "pairing_granted": {
          state = { kind: "paired" };
          const pairingId = String(frame.pairingId ?? config?.pairingId ?? "");
          const pairingKey = String(frame.pairingKey ?? "");
          if (config) {
            config = { ...config, pairingId, pairingKey };
          }
          parent.postMessage({ pluginMessage: { type: "ui-store-pairing", pairingId, pairingKey } }, "*");
          render();
          return;
        }
        case "pairing_rejected":
          return;
        case "link_blocked":
          state = {
            kind: "blocked",
            reason: String(frame.reason ?? "version mismatch"),
            requiredVersion: String(frame.requiredVersion ?? "?")
          };
          render();
          return;
        case "link_rejected":
          stopped = true;
          state = { kind: "rejected", reason: String(frame.reason ?? "rejected") };
          render();
          return;
        case "ping":
          send({ type: "pong", sentAt: frame.sentAt });
          return;
        case "request": {
          const requestId = String(frame.requestId ?? "");
          const toolName = String(frame.toolName ?? "");
          inFlight.set(requestId, toolName);
          parent.postMessage(
            {
              pluginMessage: {
                type: "server-request",
                payload: {
                  type: toolName,
                  requestId,
                  nodeIds: frame.nodeIds,
                  params: frame.params
                }
              }
            },
            "*"
          );
          return;
        }
        default:
          return;
      }
    };
    ws.onclose = () => {
      socket = null;
      if (stopped) return;
      for (const [requestId] of inFlight) {
        send({ type: "response", requestId, ok: false, message: "link closed" });
      }
      inFlight.clear();
      state = { kind: "offline" };
      render();
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
    };
    ws.onerror = () => {
    };
  };
  var onSandboxMessage = (message) => {
    if (message.type === "plugin-config") {
      config = message.payload;
      if (!socket && !stopped) connect();
      return;
    }
    if (message.type === "plugin-status") {
      const payload = message.payload;
      if (config) {
        config = { ...config, fileName: String(payload.fileName ?? config.fileName), fileKey: String(payload.fileKey ?? config.fileKey) };
      }
      if (socket && socket.readyState === WebSocket.OPEN) {
        send({ type: "plugin_status", ...payload });
      }
      return;
    }
    if (message.requestId && inFlight.has(String(message.requestId))) {
      const requestId = String(message.requestId);
      inFlight.delete(requestId);
      send({
        type: "response",
        requestId,
        ok: !message.error,
        message: typeof message.error === "string" ? message.error : "ok",
        data: message.data
      });
    }
  };
  window.onmessage = (event) => {
    const pluginMessage = event.data?.pluginMessage;
    if (pluginMessage) onSandboxMessage(pluginMessage);
  };
  var pairButton = document.getElementById("re-pair");
  pairButton.addEventListener("click", () => {
    stopped = false;
    reconnectDelay = RECONNECT_MIN_MS;
    parent.postMessage({ pluginMessage: { type: "ui-clear-pairing" } }, "*");
    config = config ? { ...config, pairingId: void 0, pairingKey: void 0 } : config;
    if (socket) socket.close();
    else connect();
  });
  parent.postMessage({ pluginMessage: { type: "ui-ready" } }, "*");
  render();
})();
</script>
  </body>
</html>
