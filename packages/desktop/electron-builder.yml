npmRebuild: false
appId: sh.jagentdesk.desktop
productName: JAgentDesk
executableName: JAgentDesk
protocols:
  - name: JAgentDesk agent link
    schemes:
      - jagentdesk
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  # Production node_modules must be copied in full. The daemon loads native
  # add-ons (better-sqlite3, oracledb, node-pty, sherpa-onnx) that are hoisted
  # to the monorepo root; restricting `files` to dist/** left those as empty
  # directories in the asar, so the worker crash-looped on `better-sqlite3`.
  - node_modules/**/*
  - "!**/*.map"
  - "!node_modules/@jagentdesk/*/src/**"
  - "!node_modules/@jagentdesk/**/*.test.*"
  - "!node_modules/@jagentdesk/**/*.spec.*"
  - "!node_modules/@jagentdesk/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@jagentdesk/*/.debug/**"
  - "!node_modules/@jagentdesk/*/.tasks/**"
  - "!node_modules/@jagentdesk/*/conversations/**"
  - "!node_modules/@jagentdesk/*/test-results/**"
  # Dev-only native toolchains that must never ship (huge, unused at runtime).
  - "!node_modules/@img/**"
  - "!node_modules/sharp/**"
  - "!node_modules/playwright/**"
  - "!node_modules/playwright-core/**"
  - "!node_modules/@oxc-resolver/**"
  - "!node_modules/@oxfmt/**"
  - "!node_modules/@oxlint/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/@tailwindcss/**"
  - "!node_modules/@unrs/**"
  - "!node_modules/@parcel/**"
  - "!node_modules/lightningcss*/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@jagentdesk/server/dist/server/terminal/shell-integration/**/*
  # Native add-ons cannot be dlopen'd from inside the asar — unpack them.
  - "**/*.node"
  - node_modules/better-sqlite3/**
  - node_modules/oracledb/**
  - node_modules/node-pty/**
  - node_modules/dtrace-provider/**
  - node_modules/fsevents/**
  - node_modules/sherpa-onnx-*/**
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../server/dist/server/go/tsnet-bridge/tailnet-bridge
    to: bin/tailnet-bridge
  - from: ../../skills
    to: skills
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: knoobdev
  repo: jagentdesk
mac:
  artifactName: "JAgentDesk-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/jagentdesk
      to: bin/jagentdesk
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "JAgentDesk-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "JAgentDesk"
  extraResources:
    - from: bin/jagentdesk
      to: bin/jagentdesk
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  # Keep the AppImage filename stable across versions so desktop shortcuts and
  # the local CLI symlink remain valid after a rebuild.
  artifactName: "JAgentDesk-${arch}.${ext}"
win:
  artifactName: "JAgentDesk-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/jagentdesk.cmd
      to: bin/jagentdesk.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
